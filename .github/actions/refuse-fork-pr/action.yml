name: Refuse fork PR
description: Stop a /deploy when the PR's head branch is not in this repo (a fork, or a fork that was deleted). Posts a comment saying why, then fails the job.

# A fork's code would build and deploy with our Azure login and GitHub App key,
# so every PR-deploy workflow that builds PR code must run this first.

inputs:
  repository:
    description: The repo the workflow runs in, e.g. owner/name (usually github.repository)
    required: true
  pr_number:
    description: The PR being deployed (usually github.event.issue.number)
    required: true
  head_repository:
    description: The full name of the PR's head repo. Empty when the fork was deleted.
    required: false
    default: ""
  commenter:
    description: The login of the user who typed /deploy (usually github.event.comment.user.login)
    required: true
  token:
    description: Token used by gh to post the comment (usually github.token)
    required: true

runs:
  using: composite
  steps:
    - name: Refuse fork PRs
      shell: pwsh
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPOSITORY: ${{ inputs.repository }}
        PR_NUMBER: ${{ inputs.pr_number }}
        HEAD_REPOSITORY: ${{ inputs.head_repository }}
        COMMENTER: ${{ inputs.commenter }}
      run: |
        if ($env:HEAD_REPOSITORY -eq $env:REPOSITORY) {
          Write-Host "✅ Deploying PR #$env:PR_NUMBER"
          exit 0
        }

        # A deleted fork has no head repo, so the head repo is empty
        if ([string]::IsNullOrEmpty($env:HEAD_REPOSITORY)) {
          $why = "its fork was deleted"
        }
        else {
          $why = "it comes from the fork $env:HEAD_REPOSITORY"
        }

        gh api "repos/$env:REPOSITORY/issues/$env:PR_NUMBER/comments" `
          -f body="🛑 Sorry @$env:COMMENTER - this PR can't get a staging slot because $why. A fork's code would build with our Azure login. Push the branch to this repo and open a new PR from it." --silent

        Write-Host "::error::Not deployed: $why. Only PRs from branches in $env:REPOSITORY are deployed."
        exit 1
